name: Deploy Messenger Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
      - name: Deploy health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.OPS_SUPABASE_PROJECT_REF }}
        run: supabase functions deploy health --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy Meta webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.OPS_SUPABASE_PROJECT_REF }}
        run: supabase functions deploy meta-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
